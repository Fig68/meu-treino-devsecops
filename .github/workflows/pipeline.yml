name: DevSecOps Pipeline Training

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: Secrets Scanning (Gitleaks)
      - name: 2. Secrets Scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # STEP 3: SAST - Análise Estática do Código (Semgrep)
      - name: 3. SAST - Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --exclude-rule='yaml.github-actions.security.github-actions-mutable-action-tag' --exclude='.github' --error
          
      # # Step 4 — SAST com Semgrep
      - name: 3. SAST - Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --exclude='.github' --error
          
      # STEP 5: Deploy (Só executa se todos os testes passarem)
      - name: 5. Deploy em Produção
        if: success()
        run: echo "🚀 Aplicação segura publicada com sucesso!"
